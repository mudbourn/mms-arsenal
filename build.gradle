plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17.14'
}

version = project.mod_version
group = project.maven_group

loom {
    accessWidenerPath = file("src/main/resources/mms_arsenal.accesswidener")
}

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url "https://api.modrinth.com/maven" }
}

// Required mods that ship nested jars, loaded from the run mods folder where the loader unpacks them.
configurations {
    runtimeMods {
        transitive = false
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.4+1.21.11"
    modImplementation "info.mudbourn:mms-render-common:${project.render_common_version}"
    modImplementation "info.mudbourn:mms-weapons:${project.weapons_version}"
    modImplementation "info.mudbourn:mms-combat:${project.combat_version}"
    runtimeMods "maven.modrinth:better-combat:${project.better_combat_version}"
    runtimeMods "maven.modrinth:player-animation-library:${project.player_animation_library_version}"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21

    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }

    withSourcesJar()
}

processResources {
    inputs.property "mod_version", project.mod_version
    filesMatching("fabric.mod.json") {
        expand "version": project.mod_version
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// Third-party mods mms-weapons requires, taken from its own dev run minus the ones listed in runtimeMods.
def weaponsRunMods = fileTree("${providers.gradleProperty('mmsSiblingRoot').getOrElse('..')}/mms-weapons/run/mods") {
    include "*.jar"
    exclude "bettercombat-*", "PlayerAnimationLib*", "cloth-config-*"
}

// Copies the required runtime mods into the dev run's mods folder.
tasks.register("syncRuntimeMods") {
    inputs.files(configurations.runtimeMods)
    inputs.files(weaponsRunMods)
    doLast {
        copy {
            from configurations.runtimeMods
            from weaponsRunMods
            into file("run/mods")
        }
    }
}

["runClient", "runServer"].each { runName ->
    tasks.named(runName) {
        dependsOn "syncRuntimeMods"
    }
}
