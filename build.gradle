plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

loom {
    accessWidenerPath = file("src/main/resources/mms_arsenal.accesswidener")
}

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url "https://api.modrinth.com/maven" }
}

// Required mods that ship nested jars, loaded from the run mods folder where the loader unpacks them.
configurations {
    runtimeMods {
        transitive = false
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "info.mudbourn:mms-render-common:${project.render_common_version}"
    implementation "info.mudbourn:mms-weapons:${project.weapons_version}"
    implementation "info.mudbourn:mms-combat:${project.combat_version}"
    compileOnly files("libs/26.3/bettercombat-fabric-3.2.2+26.3.jar")
    runtimeMods files(
        "libs/26.3/bettercombat-fabric-3.2.2+26.3.jar",
        "libs/26.3/cloth-config-fabric-26.3.159.jar",
        "libs/26.3/PlayerAnimationLibMerged-1.2.9+mc.26.3.jar"
    )
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25

    withSourcesJar()
}

processResources {
    inputs.property "mod_version", project.mod_version
    filesMatching("fabric.mod.json") {
        expand "version": project.mod_version
    }
    // inline each pose file's top "vars" block into its "$name" references
    filesMatching("assets/*/player_animations/*.json") {
        def vars = [:]
        def inVars = false
        filter { line ->
            if (line.trim() == '"vars": {') {
                inVars = true
                return null
            }
            if (inVars) {
                if (line.trim().startsWith("}")) {
                    inVars = false
                    return null
                }
                def m = line =~ /"(\w+)":\s*(-?[\d.]+)/
                vars[m[0][1]] = m[0][2]
                return null
            }
            line.replaceAll(/"\$(\w+)"/) { all, name -> vars[name] }
        }
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// Third-party mods mms-weapons and mms-combat require, taken from mms-combat's own dev run minus the ones listed in runtimeMods.
def combatRunMods = fileTree("${providers.gradleProperty('mmsSiblingRoot').getOrElse('..')}/mms-combat/run/mods") {
    include "*.jar"
    exclude "bettercombat-*", "PlayerAnimationLib*", "cloth-config-*"
}

// Copies the required runtime mods into the dev run's mods folder.
tasks.register("syncRuntimeMods") {
    inputs.files(configurations.runtimeMods)
    inputs.files(combatRunMods)
    doLast {
        copy {
            from configurations.runtimeMods
            from combatRunMods
            into file("run/mods")
        }
    }
}

["runClient", "runServer"].each { runName ->
    tasks.named(runName) {
        dependsOn "syncRuntimeMods"
    }
}
